name: External BTC ETH market data

on:
  workflow_dispatch:

jobs:
  external-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q market_reviewer tests

      - name: External runner placeholder
        run: |
          echo "fetch -> integrity gate -> generation -> immutable artifact"
          echo "artifact name: market-data-v1-${{ github.run_id }}-${{ github.run_attempt }}"
